<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Adaptive icon. KDE Plasma replaces the colours below with the current
    colour scheme: tile = background, frames = text, front frame = accent.
    Everywhere else these defaults give the mono dark look.
  -->
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Background { color: #22262c; }
    .ColorScheme-Text { color: #e6ebef; }
    .ColorScheme-Highlight { color: #e6ebef; }
    .ColorScheme-HighlightedText { color: #22262c; }
  </style>
  <rect class="ColorScheme-Background" x="16" y="16" width="480" height="480" rx="112" fill="currentColor"/>
  <rect class="ColorScheme-Text" x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="currentColor" stroke-opacity="0.14" stroke-width="3"/>
  <rect class="ColorScheme-Text" x="200" y="88" width="224" height="192" rx="30" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="18"/>
  <rect class="ColorScheme-Background" x="152" y="136" width="248" height="200" rx="30" fill="currentColor"/>
  <rect class="ColorScheme-Text" x="152" y="136" width="248" height="200" rx="30" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="18"/>
  <rect class="ColorScheme-Highlight" x="88" y="196" width="272" height="216" rx="32" fill="currentColor"/>
  <g class="ColorScheme-HighlightedText" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M177.1 273.5 A36 36 0 1 0 194 304 L174 304"/>
    <path d="M238 268 L238 340"/>
    <path d="M282 340 L282 268 L326 268 M282 302 L316 302"/>
  </g>
</svg>
