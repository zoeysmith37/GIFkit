<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="board"><rect x="64" y="292" width="384" height="160" rx="28"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#232a31"/>
  <!-- checkerboard -->
  <g clip-path="url(#board)">
    <rect x="64" y="292" width="384" height="160" fill="#eef1f4"/>
    <g fill="#9aa7b2">
      <rect x="64"  y="292" width="80" height="80"/>
      <rect x="224" y="292" width="80" height="80"/>
      <rect x="384" y="292" width="80" height="80"/>
      <rect x="144" y="372" width="80" height="80"/>
      <rect x="304" y="372" width="80" height="80"/>
    </g>
  </g>
  <!-- hammer, face resting on the board at (196, 292) -->
  <g transform="rotate(-14 196 292)">
    <rect x="226" y="150" width="232" height="44" rx="22" fill="#e08a3c"/>
    <rect x="392" y="150" width="66" height="44" rx="22" fill="#b8682a"/>
    <rect x="144" y="88" width="104" height="204" rx="20" fill="#a8b4be"/>
    <rect x="144" y="248" width="104" height="44" rx="14" fill="#7d8b97"/>
  </g>
  <!-- sparks -->
  <g stroke="#ffb22e" stroke-width="16" stroke-linecap="round">
    <line x1="112" y1="262" x2="76"  y2="236"/>
    <line x1="100" y1="214" x2="82" y2="178"/>
    <line x1="292" y1="268" x2="334" y2="252"/>
  </g>
</svg>
