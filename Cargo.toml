[package]
name = "gifkit"
version = "1.4.0"
edition = "2021"
description = "Local, cross-platform animated GIF editor / optimiser"
license = "Apache-2.0"
repository = "https://github.com/zoeysmith37/GIFkit"
build = "build.rs"

[dependencies]
crc32fast = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11", "clipboard"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp", "bmp", "rayon"] }
gif = "0.14"
png = "0.18"
color_quant = "1.1"
ab_glyph = "0.2"
rustybuzz = "0.20"
unicode-bidi = "0.3"
rayon = "1.10"
pollster = "1.0"
rfd = "0.17"
arboard = "3.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
qoi = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.23"
webp-animation = "0.10.0"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
resvg = { version = "0.45", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
