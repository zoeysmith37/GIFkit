[package]
name = "gifkit_thumbs"
version = "1.5.0"
edition = "2021"
description = "Windows Explorer thumbnails for GIFkit projects"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemServices"] }
windows-core = "0.61"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
