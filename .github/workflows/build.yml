name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: gifforge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: gifforge.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: gifforge
          - os: macos-13
            target: x86_64-apple-darwin
            bin: gifforge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev
      - run: cargo test --release --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: gifforge-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
