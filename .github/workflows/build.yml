name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev xvfb mesa-vulkan-drivers libgl1-mesa-dri libxkbcommon-x11-0

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee test.log || {
            # failures as annotations, readable without the full log
            grep -E "^test .* FAILED|panicked at|^error|assertion|left:|right:" test.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      # ---------------------------------------------------------------- Linux
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p dist/gifkit-${{ matrix.name }}
          cp target/release/gifkit README.md dist/gifkit-${{ matrix.name }}/
          cp assets/*.txt dist/gifkit-${{ matrix.name }}/
          cp assets/linux/install.sh assets/icon/gifkit.svg dist/gifkit-${{ matrix.name }}/
          tar -C dist -czf gifkit-${{ matrix.name }}.tar.gz gifkit-${{ matrix.name }}

      # the updater installs a release over a running copy of itself
      - name: Update install (Linux)
        if: runner.os == 'Linux'
        run: |
          u=$RUNNER_TEMP/u && mkdir -p $u && tar -xzf gifkit-${{ matrix.name }}.tar.gz -C $u
          prog=$u/gifkit-${{ matrix.name }}/gifkit
          printf X >> $prog
          $prog --install-update "$PWD/gifkit-${{ matrix.name }}.tar.gz"
          cmp $prog target/release/gifkit
          $prog --version

      # an AppImage too: one file, runs on most Linux systems
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o $RUNNER_TEMP/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x $RUNNER_TEMP/appimagetool
          assets/linux/build-appimage.sh target/release/gifkit $RUNNER_TEMP/appimagetool "$PWD/gifkit-${{ matrix.name }}.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./gifkit-${{ matrix.name }}.AppImage --version
          # and it updates itself
          u=$RUNNER_TEMP/ai && mkdir -p $u && cp gifkit-${{ matrix.name }}.AppImage $u/GIFkit.AppImage
          printf X >> $u/GIFkit.AppImage
          $u/GIFkit.AppImage --install-update "$PWD/gifkit-${{ matrix.name }}.AppImage"
          cmp $u/GIFkit.AppImage gifkit-${{ matrix.name }}.AppImage
          ls -la $u

      # the real window drives itself through the app and writes a report
      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          DISPLAY=:99 RUST_BACKTRACE=1 GIFKIT_SMOKE=smoke.txt timeout 180 target/release/gifkit testdata/test.gif > smoke.err 2>&1 || echo "exit $?" >> smoke.err
          touch smoke.txt
          cat smoke.txt smoke.err | tail -n 15 | while read -r l; do echo "::notice::$l"; done
          test "$(head -n1 smoke.txt)" = ok

      # ---------------------------------------------------------------- Windows
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          # Explorer thumbnails of projects
          cargo test --release --manifest-path tools/winthumb/Cargo.toml
          cargo build --release --manifest-path tools/winthumb/Cargo.toml
          Copy-Item tools/winthumb/target/release/gifkit_thumbs.dll target/release/
          $d = "dist/gifkit-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/gifkit.exe, target/release/gifkit_thumbs.dll, README.md $d
          Copy-Item assets/*.txt $d
          Compress-Archive -Path $d -DestinationPath gifkit-${{ matrix.name }}.zip
          # the installer
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF.Substring(11) }
          & $iscc /Q "/DAppVersion=$v" "/DSrc=$PWD\$d" "/O$PWD" assets/windows/gifkit.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # the updater installs a release over a running copy of itself (the
      # running program and its DLL can only be renamed out of the way)
      - name: Update install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $u = "$env:RUNNER_TEMP\u"
          Expand-Archive gifkit-${{ matrix.name }}.zip -DestinationPath $u
          $prog = "$u\gifkit-${{ matrix.name }}\gifkit.exe"
          [IO.File]::AppendAllText($prog, "X")
          $p = Start-Process -FilePath $prog -ArgumentList "--install-update", "$PWD\gifkit-${{ matrix.name }}.zip" -PassThru -Wait -RedirectStandardError upd.err
          Get-Content upd.err | ForEach-Object { Write-Host "::notice::$_" }
          if ($p.ExitCode -ne 0) { Write-Host "::error::install failed ($($p.ExitCode))"; exit 1 }
          if ((Get-FileHash $prog).Hash -ne (Get-FileHash target/release/gifkit.exe).Hash) { Write-Host "::error::not replaced"; exit 1 }
          if (-not (Test-Path "$prog.old")) { Write-Host "::error::no .old left"; exit 1 }
          Get-ChildItem "$u\gifkit-${{ matrix.name }}" | ForEach-Object { Write-Host "::notice::$($_.Name)" }

      # install for this user, update in place, uninstall
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process gifkit-${{ matrix.name }}-setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/LOG=$PWD\setup.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content setup.log | Select-Object -Last 20 | ForEach-Object { Write-Host "::notice::$_" }; Write-Host "::error::setup failed ($($p.ExitCode))"; exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\GIFkit"
          foreach ($f in "gifkit.exe", "gifkit_thumbs.dll", "unins000.exe") { if (-not (Test-Path "$app\$f")) { Write-Host "::error::$f not installed"; exit 1 } }
          $q = Start-Process "$app\gifkit.exe" -ArgumentList "--version" -PassThru -Wait -RedirectStandardOutput ver.txt
          Write-Host "::notice::installed $(Get-Content ver.txt)"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8C2E5B71-4D3A-4F6E-9B12-7A0C3E5D9F24}_is1"
          Write-Host "::notice::Apps list: $((Get-ItemProperty $key).DisplayName) $((Get-ItemProperty $key).DisplayVersion)"
          if (-not (Test-Path "HKCU:\Software\Classes\.gifkit")) { Write-Host "::error::.gifkit not registered"; exit 1 }
          # an update from inside the app, over the installed copy
          [IO.File]::AppendAllText("$app\gifkit.exe", "X")
          $q = Start-Process "$app\gifkit.exe" -ArgumentList "--install-update", "$PWD\gifkit-${{ matrix.name }}.zip" -PassThru -Wait
          if ($q.ExitCode -ne 0) { Write-Host "::error::update of the installed copy failed"; exit 1 }
          if ((Get-FileHash "$app\gifkit.exe").Hash -ne (Get-FileHash target/release/gifkit.exe).Hash) { Write-Host "::error::installed copy not updated"; exit 1 }
          # uninstall (the uninstaller hands over to a copy of itself and returns)
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\gifkit.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\gifkit.exe") { Write-Host "::error::uninstall left gifkit.exe"; exit 1 }
          if (Test-Path "HKCU:\Software\Classes\.gifkit") { Write-Host "::error::uninstall left .gifkit registered"; exit 1 }
          if (Test-Path "$app") { Get-ChildItem $app -Force | ForEach-Object { Write-Host "::notice::left: $($_.Name)" } }

      - name: Explorer thumbnails (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/gifkit.exe -ArgumentList "--register" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Host "::error::register failed ($($p.ExitCode))"; exit 1 }
          # the runner is elevated, and elevated programs ignore per-user COM
          # classes: copy the class machine-wide for this test only
          $c = "{6F3B1C2E-9A4D-4E7B-8C51-2D7A0B9E4F13}"
          reg copy "HKCU\Software\Classes\CLSID\$c" "HKLM\Software\Classes\CLSID\$c" /s /f | Out-Null
          reg copy "HKCU\Software\Classes\.gifkit" "HKLM\Software\Classes\.gifkit" /s /f | Out-Null
          Copy-Item testdata/thumbtest.gifkit "$env:RUNNER_TEMP/thumbtest.gifkit"
          ./tools/winthumb/check.ps1 -File "$env:RUNNER_TEMP/thumbtest.gifkit"

      - name: GUI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GIFKIT_SMOKE = "$PWD\smoke.txt"
          $p = Start-Process -FilePath target/release/gifkit.exe -ArgumentList "testdata/test.gif" -PassThru -RedirectStandardError smoke.err
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Add-Content smoke.err "hung" }
          Add-Content smoke.err "exit $($p.ExitCode)"
          if (-not (Test-Path smoke.txt)) { New-Item smoke.txt | Out-Null }
          (Get-Content smoke.txt) + (Get-Content smoke.err | Select-Object -Last 15) | ForEach-Object { Write-Host "::notice::$_" }
          if ((Get-Content smoke.txt -TotalCount 1) -ne "ok") { exit 1 }

      # ---------------------------------------------------------------- macOS (universal .app)
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          APP=dist/GIFkit.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          lipo -create -output $APP/Contents/MacOS/gifkit \
            target/aarch64-apple-darwin/release/gifkit \
            target/x86_64-apple-darwin/release/gifkit
          cp assets/icon/gifkit.icns $APP/Contents/Resources/gifkit.icns
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          case "$GITHUB_REF" in refs/tags/v*) VERSION=${GITHUB_REF#refs/tags/v} ;; esac
          cat > $APP/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>GIFkit</string>
            <key>CFBundleDisplayName</key><string>GIFkit</string>
            <key>CFBundleIdentifier</key><string>io.github.zoeysmith37.gifkit</string>
            <key>CFBundleExecutable</key><string>gifkit</string>
            <key>CFBundleIconFile</key><string>gifkit</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key><array><dict>
              <key>CFBundleTypeName</key><string>Image</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>LSItemContentTypes</key><array>
                <string>com.compuserve.gif</string><string>public.png</string><string>org.webmproject.webp</string>
              </array>
            </dict><dict>
              <key>CFBundleTypeName</key><string>GIFkit project</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>LSHandlerRank</key><string>Owner</string>
              <key>LSItemContentTypes</key><array><string>io.github.zoeysmith37.gifkit.project</string></array>
            </dict></array>
            <key>UTExportedTypeDeclarations</key><array><dict>
              <key>UTTypeIdentifier</key><string>io.github.zoeysmith37.gifkit.project</string>
              <key>UTTypeDescription</key><string>GIFkit project</string>
              <key>UTTypeConformsTo</key><array><string>public.data</string></array>
              <key>UTTypeIconFile</key><string>gifkit</string>
              <key>UTTypeTagSpecification</key><dict>
                <key>public.filename-extension</key><array><string>gifkit</string></array>
                <key>public.mime-type</key><array><string>application/x-gifkit</string></array>
              </dict>
            </dict></array>
          </dict></plist>
          EOF
          # Finder thumbnails of projects: a Quick Look extension, signed
          # with its own sandbox first, then the app around it
          tools/macthumb/build.sh $APP $VERSION
          codesign --force --sign - $APP
          cp README.md dist/
          cd dist && zip -qry ../gifkit-${{ matrix.name }}.zip GIFkit.app README.md

      # the updater swaps in a new GIFkit.app under a running copy of itself
      - name: Update install (macOS)
        if: runner.os == 'macOS'
        run: |
          u=$RUNNER_TEMP/u && mkdir -p $u && ditto -x -k gifkit-${{ matrix.name }}.zip $u
          printf X >> $u/GIFkit.app/Contents/Resources/marker
          $u/GIFkit.app/Contents/MacOS/gifkit --install-update "$PWD/gifkit-${{ matrix.name }}.zip"
          test ! -e $u/GIFkit.app/Contents/Resources/marker
          $u/GIFkit.app/Contents/MacOS/gifkit --version
          codesign --verify --deep $u/GIFkit.app && echo "::notice::signature intact"
          ls -a $u

      - name: Finder thumbnails (macOS)
        if: runner.os == 'macOS'
        # Quick Look on a headless runner is unreliable: report, don't block
        continue-on-error: true
        timeout-minutes: 6
        run: |
          note() { while read -r l; do echo "::notice::$l"; done; }
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          # the extension's zip reading, on real projects
          swiftc tools/macthumb/Zip.swift tools/macthumb/main.swift -o ziptest
          ./ziptest testdata/thumbtest.gifkit | note
          cp -R dist/GIFkit.app /Applications/
          EXT=/Applications/GIFkit.app/Contents/PlugIns/GIFkitThumbnail.appex
          codesign -dv --entitlements - "$EXT" 2>&1 | grep -E "Identifier|Signature|sandbox" | note
          plutil -lint "$EXT/Contents/Info.plist" /Applications/GIFkit.app/Contents/Info.plist | note
          limit 60 $LSREG -f -R -trusted /Applications/GIFkit.app || echo "lsregister timed out" | note
          limit 30 pluginkit -a "$EXT" || echo "pluginkit -a failed" | note
          limit 30 pluginkit -e use -i io.github.zoeysmith37.gifkit.thumbnail || true
          sleep 5
          limit 30 pluginkit -m -A -D -v -p com.apple.quicklook.thumbnail 2>&1 | grep -i gifkit | note
          limit 30 pluginkit -m -A -D -v -i io.github.zoeysmith37.gifkit.thumbnail 2>&1 | head -n 5 | note
          limit 30 log show --last 3m --style compact --predicate 'process == "pkd" OR subsystem == "com.apple.PlugInKit"' 2>/dev/null | grep -i -E "gifkit|reject|invalid|error" | tail -n 15 | note
          limit 60 $LSREG -dump 2>/dev/null | grep -i -A2 "gifkit.project" | head -n 6 | note
          cp testdata/thumbtest.gifkit "$RUNNER_TEMP/t.gifkit"
          limit 20 mdls -name kMDItemContentType "$RUNNER_TEMP/t.gifkit" | note
          mkdir -p qlout
          limit 90 qlmanage -t -s 128 -o qlout "$RUNNER_TEMP/t.gifkit" 2>&1 | tail -n 5 | note || true
          ls qlout | note
          test -f qlout/t.gifkit.png && echo "Finder thumbnail made" | note

      - name: GUI smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          GIFKIT_SMOKE=smoke.txt target/aarch64-apple-darwin/release/gifkit testdata/test.gif 2> smoke.err &
          pid=$!
          for i in $(seq 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null && echo hung >> smoke.err || true
          touch smoke.txt
          cat smoke.txt smoke.err | tail -n 15 | while read -r l; do echo "::notice::$l"; done
          test "$(head -n1 smoke.txt)" = ok

      - uses: actions/upload-artifact@v4
        with:
          name: gifkit-${{ matrix.name }}
          path: |
            gifkit-${{ matrix.name }}.*
            gifkit-${{ matrix.name }}-setup.exe

      # each system adds its own file to the release as soon as it's built,
      # so one slow or stuck runner never holds the others back
      - name: Add to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gifkit-${{ matrix.name }}.*
            gifkit-${{ matrix.name }}-setup.exe
          generate_release_notes: true
