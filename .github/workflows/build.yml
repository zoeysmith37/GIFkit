name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev

      - name: Test
        run: cargo test --release

      # ---------------------------------------------------------------- Linux
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p dist/gifforge-${{ matrix.name }}
          cp target/release/gifforge README.md dist/gifforge-${{ matrix.name }}/
          cp assets/*.txt dist/gifforge-${{ matrix.name }}/
          cp assets/linux/gifforge.desktop assets/linux/install.sh assets/icon/gifforge.svg dist/gifforge-${{ matrix.name }}/
          cp assets/icon/gifforge-256.png dist/gifforge-${{ matrix.name }}/gifforge.png
          tar -C dist -czf gifforge-${{ matrix.name }}.tar.gz gifforge-${{ matrix.name }}

      # ---------------------------------------------------------------- Windows
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          $d = "dist/gifforge-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/gifforge.exe, README.md $d
          Copy-Item assets/*.txt $d
          Compress-Archive -Path $d -DestinationPath gifforge-${{ matrix.name }}.zip

      # ---------------------------------------------------------------- macOS (universal .app)
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          APP=dist/GifForge.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          lipo -create -output $APP/Contents/MacOS/gifforge \
            target/aarch64-apple-darwin/release/gifforge \
            target/x86_64-apple-darwin/release/gifforge
          cp assets/icon/gifforge.icns $APP/Contents/Resources/gifforge.icns
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > $APP/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>GifForge</string>
            <key>CFBundleDisplayName</key><string>GifForge</string>
            <key>CFBundleIdentifier</key><string>io.github.zoeysmith37.gifforge</string>
            <key>CFBundleExecutable</key><string>gifforge</string>
            <key>CFBundleIconFile</key><string>gifforge</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key><array><dict>
              <key>CFBundleTypeName</key><string>Image</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>LSItemContentTypes</key><array>
                <string>com.compuserve.gif</string><string>public.png</string><string>org.webmproject.webp</string>
              </array>
            </dict></array>
          </dict></plist>
          EOF
          codesign --force --deep --sign - $APP
          cp README.md dist/
          cd dist && zip -qry ../gifforge-${{ matrix.name }}.zip GifForge.app README.md

      - uses: actions/upload-artifact@v4
        with:
          name: gifforge-${{ matrix.name }}
          path: gifforge-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
